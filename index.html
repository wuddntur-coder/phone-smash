<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141312">
<meta name="description" content="바뿌(바탕화면 뿌수기): 내 폰 홈 화면을 망치, 총, 화염, 폭탄, 벌레로 부수는 스트레스 해소 게임">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="바뿌">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>바뿌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* Layout: one-screen arcade. HUD strip on top, phone-glass stage in the middle, weapon rack (long-press for variants) docked at the bottom */
:root{
  color-scheme:dark;
  --bg:#141312;
  --panel:#1f1d1b;
  --panel-2:#2a2724;
  --line:#36312c;
  --fg:#f3efe8;
  --muted:#a0988d;
  --accent:#ffa21f;
  --accent-ink:#1d1306;
  --hot:#ff4d3a;
  --display:'Black Han Sans','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --ui:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overscroll-behavior:none}
html{background:var(--bg)}
body{touch-action:manipulation;word-break:keep-all;background:var(--bg);color:var(--fg);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
.app{height:100%;box-sizing:border-box;max-width:520px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right));padding-block:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}

.hud{display:flex;align-items:center;gap:12px}
.hud h1{margin:0;font-family:var(--display);font-weight:400;font-size:30px;line-height:1;letter-spacing:-.02em;white-space:nowrap}
.hud h1 span{color:var(--accent)}
.meter{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--muted);letter-spacing:.06em}
.meter-top b{font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:0;color:var(--fg);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--panel);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--hot));transition:width .25s ease-out}
.icon-btn{flex:none;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0}
.icon-btn svg{width:20px;height:20px}
.icon-btn:focus-visible,.rack button:focus-visible,.picker-list button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon-btn[aria-pressed="false"]{color:var(--muted)}

.stage{position:relative;flex:1;min-height:0;margin:6px;border-radius:30px;overflow:hidden;background:#000;
  box-shadow:0 0 0 6px #050505,0 0 0 7px var(--line),0 18px 40px -10px rgba(0,0,0,.7);
  touch-action:none;-webkit-touch-callout:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hint{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);margin:0;padding:8px 14px;border-radius:999px;max-width:calc(100% - 32px);box-sizing:border-box;
  background:rgba(10,9,8,.78);color:var(--fg);font-size:13px;text-align:center;pointer-events:none;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .4s}
.hint b{color:var(--accent);font-weight:600}
.hint.off{opacity:0}
.toast{position:absolute;inset:auto 16px 50% 16px;transform:translateY(50%);text-align:center;pointer-events:none;
  font-family:var(--display);font-size:34px;line-height:1.15;color:var(--accent);
  text-shadow:0 3px 0 #000,0 0 24px rgba(255,120,30,.6)}
.toast small{display:block;font-family:var(--ui);font-size:13px;color:var(--fg);text-shadow:0 1px 3px #000;margin-top:6px}
.combo{position:absolute;top:44px;right:14px;pointer-events:none;text-align:right;font-family:var(--display);line-height:.9;
  color:var(--accent);text-shadow:0 3px 0 #000,0 0 18px rgba(255,120,30,.55)}
.combo b{display:block;font-weight:400;font-size:46px;font-variant-numeric:tabular-nums}
.combo span{font-size:14px;letter-spacing:.12em;color:var(--fg)}
.kills{position:absolute;top:44px;left:14px;pointer-events:none;font-family:var(--display);font-size:15px;color:#c8f07a;text-shadow:0 2px 0 #000}
.stage.fever .combo{color:#ff4dd2;text-shadow:0 3px 0 #000,0 0 22px rgba(255,60,200,.7)}
.stage.fever{animation:fever .45s ease-in-out infinite alternate}
@keyframes fever{
  from{box-shadow:0 0 0 6px #050505,0 0 0 8px var(--hot),0 0 26px 6px rgba(255,77,58,.55)}
  to{box-shadow:0 0 0 6px #050505,0 0 0 8px var(--accent),0 0 44px 12px rgba(255,162,31,.75)}
}
@media (prefers-reduced-motion:reduce){.stage.fever{animation:none;box-shadow:0 0 0 6px #050505,0 0 0 8px var(--hot)}}
.detonate{position:absolute;right:14px;bottom:110px;width:68px;height:68px;border-radius:50%;border:3px solid #2a0a06;
  background:radial-gradient(circle at 35% 30%,#ff7a66,#d8241a 60%,#8e120b);color:#fff;font-family:var(--display);font-size:18px;
  box-shadow:0 4px 0 #4a0904,0 8px 18px rgba(0,0,0,.5);cursor:pointer;touch-action:manipulation}
.detonate:active{transform:translateY(3px);box-shadow:0 1px 0 #4a0904}

.rack-wrap{position:relative}
.rack{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.rack button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 1px 7px;border-radius:13px;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);font-family:var(--ui);font-size:10.5px;letter-spacing:-.03em;cursor:pointer;min-width:0;-webkit-touch-callout:none}
.rack button::after{content:"";position:absolute;top:5px;right:5px;border-left:5px solid transparent;border-top:5px solid currentColor;opacity:.55}
.rack button svg{width:22px;height:22px}
.rack button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rack button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.rack button[data-w="nuke"]{color:var(--hot)}
.rack button[data-w="nuke"][aria-pressed="true"]{background:var(--hot);border-color:var(--hot);color:#fff}
.scrim{position:fixed;inset:0;z-index:5}
.picker{position:absolute;left:0;right:0;bottom:calc(100% + 10px);z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:14px;box-shadow:0 -10px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:10px}
.picker-head{display:flex;justify-content:space-between;align-items:baseline}
.picker-head b{font-family:var(--display);font-weight:400;font-size:18px}
.picker-head span{font-size:11px;color:var(--muted)}
.picker-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.picker-list button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border-radius:12px;
  border:1px solid var(--line);background:var(--panel-2);color:var(--fg);font-family:var(--ui);cursor:pointer;min-width:0}
.picker-list button b{font-size:14px;font-weight:600}
.picker-list button span{font-size:11px;color:var(--muted);line-height:1.35}
.picker-list button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.picker-list button[aria-pressed="true"] b{color:var(--accent)}
.install-tip{position:absolute;left:12px;right:12px;top:12px;z-index:6;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;
  background:rgba(20,19,18,.92);border:1px solid var(--line);font-size:13px;line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.install-tip p{margin:0;flex:1;min-width:0}
.install-tip b{color:var(--accent)}
.install-tip button{flex:none;border:0;border-radius:10px;padding:6px 10px;background:var(--panel-2);color:var(--fg);font-family:var(--ui);font-size:12px;cursor:pointer}
.install-tip .go{background:var(--accent);color:var(--accent-ink);font-weight:600}
body.wide .app{max-width:min(1400px,100%)}
.start{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:16px;box-sizing:border-box;
  background:rgba(10,9,8,.6);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);overflow-y:auto}
.start-card{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:stretch;gap:10px;text-align:center}
.start .logo{margin:0;font-family:var(--display);font-weight:400;font-size:84px;line-height:.95;letter-spacing:-.03em;
  color:var(--fg);text-shadow:0 5px 0 #000,0 0 40px rgba(255,140,30,.45)}
.start .logo span{color:var(--accent)}
.start .sub{margin:0 0 10px;font-size:14px;letter-spacing:.3em;color:var(--muted)}
.btn-main,.btn-sub{border-radius:16px;padding:15px 16px;font-family:var(--display);font-size:20px;cursor:pointer;border:0}
.btn-main{background:var(--accent);color:var(--accent-ink);box-shadow:0 5px 0 #a35e00}
.btn-main:active{transform:translateY(3px);box-shadow:0 2px 0 #a35e00}
.btn-sub{background:var(--panel);color:var(--fg);border:1px solid var(--line);font-size:16px;padding:12px 16px}
.btn-main:focus-visible,.btn-sub:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.start .how{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--fg)}
.start .how b{color:var(--accent);font-weight:600}
.start .note{margin:0;font-size:11px;color:var(--muted)}
.start .err{margin:0;font-size:13px;color:#ffb3a8}
@media (max-width:360px){.hud h1{font-size:26px}.rack button{font-size:9.5px}}
</style>
</head>
<body>

<div class="app">
  <header class="hud">
    <h1>바<span>뿌</span></h1>
    <div class="meter">
      <div class="meter-top"><span>파손율</span><b id="pct">0%</b></div>
      <div class="bar"><i id="barFill"></i></div>
    </div>
    <button class="icon-btn" id="sound" aria-pressed="true" aria-label="소리 켜기/끄기" title="소리">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path id="mutex" d="M17 9l5 6M22 9l-5 6" hidden/></svg>
    </button>
    <button class="icon-btn" id="reset" aria-label="새 화면" title="새 화면">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg>
    </button>
  </header>

  <main class="stage" id="stage">
    <canvas id="base"></canvas>
    <canvas id="fx"></canvas>
    <div class="combo" id="combo" hidden><b id="comboN">0</b><span>콤보</span></div>
    <div class="kills" id="kills" hidden>처치 <span id="killN">0</span></div>
    <p class="hint off" id="hint">무기 버튼을 <b>꾹 누르면</b> 다른 종류로 바꿀 수 있어요</p>
    <div class="toast" id="toast" hidden>완전히 박살!<small>새 화면 버튼으로 다시 시작</small></div>
    <button class="detonate" id="detonate" hidden>기폭</button>
    <div class="start" id="start">
      <div class="start-card">
        <h2 class="logo">바<span>뿌</span></h2>
        <p class="sub">바탕화면 뿌수기</p>
        <button class="btn-main" id="startCapture" hidden>지금 화면 캡처해서 시작</button>
        <button class="btn-main" id="startPick">내 화면으로 시작</button>
        <button class="btn-sub" id="startAgain" hidden>방금 그 화면으로 다시</button>
        <button class="btn-sub" id="startDefault">기본 화면으로 시작</button>
        <p class="err" id="startErr" hidden></p>
        <p class="how" id="startHow">먼저 홈 화면을 스크린샷으로 찍어 두세요. 그다음 <b>내 화면으로 시작</b>을 누르고 방금 찍은 사진을 고르면 돼요.</p>
        <p class="note">사진은 이 기기 안에서만 쓰이고 어디로도 보내지 않아요.</p>
      </div>
      <input type="file" id="filePick" accept="image/*" hidden>
    </div>
    <div class="install-tip" id="installTip" hidden>
      <p id="installText">홈 화면에 추가하면 앱처럼 전체 화면으로 할 수 있어요.</p>
      <button class="go" id="installGo" hidden>설치</button>
      <button id="installClose">닫기</button>
    </div>
  </main>

  <div class="rack-wrap">
    <div class="scrim" id="scrim" hidden></div>
    <div class="picker" id="picker" hidden role="dialog" aria-labelledby="pickerTitle">
      <div class="picker-head"><b id="pickerTitle">타격 도구</b><span>골라서 바꾸세요</span></div>
      <div class="picker-list" id="pickerList"></div>
    </div>
    <nav class="rack" id="rack" aria-label="무기 (꾹 누르면 종류 선택)">
      <button data-w="hammer" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M13 3.5l7.5 7.5-2.5 2.5L10.5 6z"/><path d="M12.5 8.5L4.2 16.8a2 2 0 0 0 2.9 2.9l8.3-8.3"/></svg><span>망치</span></button>
      <button data-w="gun" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M2.5 8.5h16l1.5-1.5h1.5v5h-7l-1.5 2v4.5h-3.5l.5-4.5-1.5-1.5H2.5z"/><path d="M11 12.5h2.5"/></svg><span>기관총</span></button>
      <button data-w="flame" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2.5c.8 4 6 6.2 6 11.5a6 6 0 0 1-12 0c0-3 1.6-4.4 2.2-6.8 1.6 1 2.6 2.8 2.8 4.8 1.2-2.4 1.4-5.6 1-9.5z"/></svg><span>화염</span></button>
      <button data-w="saw" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><rect x="2" y="9" width="7" height="8" rx="1.5"/><path d="M9 11h11a2 2 0 0 1 0 4H9"/><path d="M10.5 11l1-2 1 2 1-2 1 2 1-2 1 2 1-2 1 2"/></svg><span>전기톱</span></button>
      <button data-w="bomb" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><circle cx="10" cy="14.5" r="6.5"/><path d="M14.6 9.9l2.2-2.2"/><path d="M16.8 7.7c.8-2.2 2.8-3 4.4-2"/></svg><span>폭탄</span></button>
      <button data-w="bug" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><ellipse cx="12" cy="14.5" rx="3.8" ry="5.5"/><circle cx="12" cy="6.5" r="2.2"/><path d="M8.2 12H4.5M8.2 16H4.5M15.8 12h3.7M15.8 16h3.7M10.5 4.5L9 2.5M13.5 4.5L15 2.5"/></svg><span>흰개미</span></button>
      <button data-w="nuke" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path fill="currentColor" stroke="none" d="M12 12L8.6 6.1a6.8 6.8 0 0 1 6.8 0zM12 12h6.8a6.8 6.8 0 0 1-3.4 5.9zM12 12l-3.4 5.9A6.8 6.8 0 0 1 5.2 12z"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg><span>핵폭탄</span></button>
    </nav>
  </div>
</div>

<script>
(() => {
const stage = document.getElementById('stage');
const base = document.getElementById('base'), fx = document.getElementById('fx');
const bctx = base.getContext('2d', { willReadFrequently: true }), fctx = fx.getContext('2d');
const hintEl = document.getElementById('hint'), toastEl = document.getElementById('toast');
const pctEl = document.getElementById('pct'), barEl = document.getElementById('barFill');
const comboEl = document.getElementById('combo'), comboN = document.getElementById('comboN');
const killsEl = document.getElementById('kills'), killN = document.getElementById('killN');
const detBtn = document.getElementById('detonate');
const UI = "'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif";
const DISPLAY = "'Black Han Sans','Apple SD Gothic Neo','Malgun Gothic',sans-serif";
const VOID = '#060608';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

let W = 0, H = 0, DPR = 1, weapon = 'hammer', dirty = false;

/* ---------- tool catalogue ---------- */
const TOOLS = {
  hammer: { title: '타격 도구', v: [
    { id: 'hammer', name: '망치', s: '망치', d: '탭하면 쩍. 가끔 크리티컬' },
    { id: 'sledge', name: '오함마', s: '오함마', d: '느리지만 한 방이 엄청 커요' },
    { id: 'fist', name: '펀치', s: '펀치', d: '작게, 대신 빠르게 연타' },
    { id: 'squeak', name: '뿅망치', s: '뿅망치', d: '안 깨지고 뿅! 벌레는 납작' } ] },
  gun: { title: '총기', v: [
    { id: 'mg', name: '기관총', s: '기관총', d: '누르고 있으면 연사' },
    { id: 'pistol', name: '권총', s: '권총', d: '탭할 때마다 한 발' },
    { id: 'shotgun', name: '샷건', s: '샷건', d: '산탄 9발이 넓게 퍼져요' },
    { id: 'sniper', name: '저격총', s: '저격총', d: '누르면 조준경, 떼면 발사' } ] },
  flame: { title: '화염과 광선', v: [
    { id: 'flamer', name: '화염방사기', s: '화염', d: '문질러 태우기. 벌레가 타 죽어요' },
    { id: 'laser', name: '레이저', s: '레이저', d: '그은 자리가 녹아내려요' },
    { id: 'acid', name: '산성액', s: '산성액', d: '흘러내리며 화면을 녹여요' },
    { id: 'freeze', name: '냉동총', s: '냉동총', d: '성에가 끼고 벌레가 얼어요' } ] },
  saw: { title: '절단 도구', v: [
    { id: 'chainsaw', name: '전기톱', s: '전기톱', d: '드래그해서 썰기' },
    { id: 'katana', name: '일본도', s: '일본도', d: '빠르게 그으면 깔끔하게 베여요' },
    { id: 'grinder', name: '그라인더', s: '그라인더', d: '불꽃 튀며 긁어내기' },

/* ---------- main loop ---------- */
let lastT = performance.now(), beepT = 0;
function frame(t) {
  const dt = Math.min(.05, (t - lastT) / 1000); lastT = t;
  fctx.clearRect(0, 0, W, H);
  const S = { flame: 0, hiss: 0, saw: 0, sawF: [88, 135], laser: 0, scope: null };
  attract = null;

  for (let i = dooms.length - 1; i >= 0; i--) {
    const d = dooms[i]; d.t += dt;
    if (d.kind === 'blackhole') { if (d.t >= BH_T) { dooms.splice(i, 1); collapse(d); } else updateBlackhole(d, dt, t); }
  }
  for (let i = fires.length - 1; i >= 0; i--) {
    const f = fires[i]; f.life += dt;
    if (f.life >= f.max) { fires.splice(i, 1); continue; }
    const k = 1 - f.life / f.max;
    if (Math.random() < .5 + k * .5) P({ t: 'flame', x: f.x + rand(-5, 5), y: f.y, vx: rand(-15, 15), vy: -rand(40, 100), max: rand(.35, .7), size: rand(4, 8) * (.5 + k) });
    if (Math.random() < .25) scorch(f.x + rand(-8, 8), f.y + rand(-8, 8), rand(10, 20));
    if (Math.random() < .04) smoke(f.x, f.y - 20, 1);
    if (crits.length) killAt(f.x, f.y - 6, 16, 'burn');
  }
  for (let i = drips.length - 1; i >= 0; i--) {
    const d = drips[i]; d.life += dt;
    if (d.life >= d.max || d.y > H + 10) { drips.splice(i, 1); continue; }
    d.y += d.vy * dt; d.x += Math.sin(t / 300 + d.ph) * .3;
    const r = d.r * (1 - d.life / d.max * .6);
    acidEat(d.x, d.y, r);
    if (Math.random() < .05) P({ t: 'smoke', x: d.x, y: d.y, vx: 0, vy: -20, max: .8, size: 5 });
    if (crits.length) killAt(d.x, d.y, r + 4, 'melt');
  }
  for (const p of pointers.values()) onHold(p.v, p, t, dt, S);
  const moz = updateCrits(dt, t);
  for (let i = bombs.length - 1; i >= 0; i--) {
    const b = bombs[i]; b.t += dt;
    if (b.t >= b.fuse || (b.boomAt != null && b.t >= b.boomAt)) { bombs.splice(i, 1); boomBomb(b); continue; }
    drawBomb(b, t);
  }
  const armed = bombs.some(b => b.kind === 'c4' && b.boomAt == null);
  if (detBtn.hidden === armed) detBtn.hidden = !armed;
  if (bombs.some(b => b.kind === 'c4') && t - beepT > 1000) { beepT = t; sfx.beep(); }
  const tntLit = bombs.some(b => b.kind === 'tnt');
  for (let i = dooms.length - 1; i >= 0; i--) {
    const d = dooms[i];
    if (d.kind === 'nuke') { if (d.t >= NUKE_T) { dooms.splice(i, 1); detonate(d.x, d.y); } else drawNuke(d, t); }
    else if (d.kind === 'meteor') { if (d.t >= METEOR_T) { dooms.splice(i, 1); meteorImpact(d.x, d.y); } else drawMeteor(d); }
  }
  drawParts(dt);
  if (S.scope) drawScope(S.scope);
  if (flashA > .005) { fctx.fillStyle = `rgba(${flashCol},${flashA})`; fctx.fillRect(0, 0, W, H); flashA = Math.max(0, flashA - flashDecay * dt); }
  if (combo && t - lastHit > 1000) { combo = 0; comboEl.hidden = true; if (fever) { fever = false; stage.classList.remove('fever'); } }

  if (AC) {
    const now = AC.currentTime;
    flameG.gain.setTargetAtTime(S.flame ? .4 : fires.length ? Math.min(.25, fires.length * .015) : 0, now, .05);
    hissG.gain.setTargetAtTime(Math.min(.18, S.hiss * .12 + (tntLit ? .1 : 0)), now, .05);
    sawG.gain.setTargetAtTime(S.saw ? (S.saw > 1 ? .2 : .1) : 0, now, .04);
    sawOsc.frequency.setTargetAtTime(S.saw > 1 ? S.sawF[1] : S.sawF[0], now, .08);
    laserG.gain.setTargetAtTime(S.laser ? .12 : 0, now, .03);
    mozG.gain.setTargetAtTime(moz ? Math.min(.09, .025 + moz * .012) : 0, now, .1);
  }
  updateMeter();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- install as app (iPhone: Safari share sheet, Galaxy/Android: install prompt) ---------- */
const tip = document.getElementById('installTip'), tipText = document.getElementById('installText'), tipGo = document.getElementById('installGo');
const standalone = matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let tipSeen = false; try { tipSeen = localStorage.getItem('pd-tip') === '1'; } catch (e) {}
let deferred = null;
const hideTip = () => { tip.hidden = true; try { localStorage.setItem('pd-tip', '1'); } catch (e) {} };
document.getElementById('installClose').addEventListener('click', hideTip);
tip.addEventListener('pointerdown', e => e.stopPropagation());
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferred = e;
  if (standalone || tipSeen) return;
  tipText.innerHTML = '<b>앱으로 설치</b>하면 홈 화면 아이콘으로 바로 실행되고 전체 화면으로 할 수 있어요.';
  tipGo.hidden = false; tip.hidden = false;
});
tipGo.addEventListener('click', async () => {
  if (!deferred) return;
  deferred.prompt();
  try { await deferred.userChoice; } catch (e) {}
  deferred = null; hideTip();
});
if (isIOS && !standalone && !tipSeen) setTimeout(() => {
  tipText.innerHTML = 'Safari 아래쪽 <b>공유 버튼</b>(네모에 위쪽 화살표)을 누르고 <b>홈 화면에 추가</b>를 고르면 앱처럼 깔려요.';
  tip.hidden = false;
}, 1500);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
